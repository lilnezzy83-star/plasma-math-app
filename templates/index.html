<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plasma Portal - Auth</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2b093f, #12011b, #43105a);
            background-size: 400% 400%;
            animation: plasmaFlow 12s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        @keyframes plasmaFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .floating-icons {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .float-symbol {
            position: absolute;
            font-size: 3.5rem;
            font-weight: bold;
            color: #ff77ff;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #8a2be2, 0 0 40px #00ffff;
            animation: floatOrganic 10s ease-in-out infinite;
        }
        @keyframes floatOrganic {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
        .card {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 420px;
            background: rgba(30, 10, 45, 0.85);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(138, 43, 226, 0.5);
            border: 1px solid rgba(255, 0, 255, 0.3);
            text-align: center;
        }
        h1 { color: #e0b0ff; margin-bottom: 5px; text-shadow: 0 0 10px rgba(224, 176, 255, 0.6); }
        p { color: #d8bfd8; font-size: 0.9rem; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid rgba(186, 85, 211, 0.4);
            background: #2d1242;
            color: white;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #00ffff; box-shadow: 0 0 10px #00ffff; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button {
            flex: 1;
            padding: 12px;
            background-color: #8a2be2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.8);
            transition: 0.3s;
        }
        button.login-btn { background-color: #4b0082; }
        button:hover { box-shadow: 0 0 25px #00ffff; }
        .error { color: #ff6b6b; margin-top: 10px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="floating-icons">
        <div class="float-symbol" style="left: 15%; animation-delay: 0s;">+</div>
        <div class="float-symbol" style="left: 45%; animation-delay: 3s;">-</div>
        <div class="float-symbol" style="left: 75%; animation-delay: 1.5s;">×</div>
    </div>

    <div class="card">
        <h1>Plasma Portal</h1>
        <p>Enter your Email, Name, or Phone Number and a password (min 8 chars)</p>
        
        <form method="POST">
            <input type="text" name="identifier" placeholder="Email, Name, or Phone Number" required>
            <input type="password" name="password" placeholder="Password (8+ characters)" minlength="8" required>
            
            <div class="btn-group">
                <button type="submit" name="action" value="signup">Sign Up</button>
                <button type="submit" name="action" value="login" class="login-btn">Log In</button>
            </div>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
